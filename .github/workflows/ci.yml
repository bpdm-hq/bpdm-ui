name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint · Typecheck · Test · Build · Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history so Turborepo can diff against the base and run only
          # the packages affected by this change
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # One Turborepo run, scoped to affected packages only — unchanged packages
      # are not executed and never appear in the output. A change to a root file
      # (lockfile, turbo.json, …) invalidates the global hash and runs
      # everything, as it should.
      - name: Verify affected packages
        run: pnpm exec turbo run lint typecheck test build size --affected
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}

  # Which framework packages are affected by this change? The browser-axe sweep
  # below is the expensive part (~15 min per framework), so we only run it for the
  # frameworks that actually changed. A change to a shared dependency (tokens,
  # variants) or a root / CI file affects both.
  changes:
    name: Detect affected frameworks
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.flags.outputs.ui }}
      ng: ${{ steps.flags.outputs.ng }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: pf
        with:
          filters: |
            shared:
              - 'packages/tokens/**'
              - 'packages/variants/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            react:
              - 'packages/react/**'
            angular:
              - 'packages/angular/**'

      - id: flags
        run: |
          ui=false; ng=false
          if [ "${{ steps.pf.outputs.shared }}" = "true" ]; then ui=true; ng=true; fi
          if [ "${{ steps.pf.outputs.react }}" = "true" ]; then ui=true; fi
          if [ "${{ steps.pf.outputs.angular }}" = "true" ]; then ng=true; fi
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
          echo "ng=$ng" >> "$GITHUB_OUTPUT"
          echo "affected → @bpdm/ui=$ui  @bpdm/ng=$ng"

  # Real-browser colour-contrast gate: builds each Storybook, runs axe-core over
  # every story × 4 themes × LTR/RTL in headless Chromium. jsdom (the unit test
  # suite) can't compute contrast, so this is what actually guards the token /
  # `-strong` contrast work against regressions. Per framework, and now gated on
  # `changes`: an unaffected framework's leg still reports a (fast) green check —
  # so required-check branch protection never waits on it — but skips the sweep.
  a11y-browser:
    name: Accessibility · browser-axe
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: ['@bpdm/ui', '@bpdm/ng']
    steps:
      - id: gate
        run: |
          run=false
          if [ "${{ matrix.package }}" = "@bpdm/ui" ] && [ "${{ needs.changes.outputs.ui }}" = "true" ]; then run=true; fi
          if [ "${{ matrix.package }}" = "@bpdm/ng" ] && [ "${{ needs.changes.outputs.ng }}" = "true" ]; then run=true; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = "true" ]; then
            echo "▶ ${{ matrix.package }} affected — running contrast sweep"
          else
            echo "⏭ ${{ matrix.package }} unchanged — skipping sweep"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - name: Install pnpm
        if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@v4

      - name: Set up Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Chromium (Playwright)
        if: steps.gate.outputs.run == 'true'
        run: pnpm --filter ${{ matrix.package }} exec playwright install --with-deps chromium

      # Storybook builds from source and imports the workspace's built packages
      # (e.g. @bpdm/variants dist) — a fresh install doesn't build them, so do it
      # here before the Storybook build inside the sweep.
      - name: Build workspace dependencies
        if: steps.gate.outputs.run == 'true'
        run: pnpm exec turbo run build --filter=${{ matrix.package }}^...

      - name: Contrast sweep (all themes × dir)
        if: steps.gate.outputs.run == 'true'
        run: pnpm --filter ${{ matrix.package }} test:a11y:browser
