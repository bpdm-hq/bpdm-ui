name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint · Typecheck · Test · Build · Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history so Turborepo can diff against the base and run only
          # the packages affected by this change
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # One Turborepo run, scoped to affected packages only — unchanged packages
      # are not executed and never appear in the output. A change to a root file
      # (lockfile, turbo.json, …) invalidates the global hash and runs
      # everything, as it should.
      - name: Verify affected packages
        run: pnpm exec turbo run lint typecheck test build size --affected
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}

  # Real-browser colour-contrast gate: builds each Storybook, runs axe-core over
  # every story × 4 themes × LTR/RTL in headless Chromium. jsdom (the unit test
  # suite) can't compute contrast, so this is what actually guards the token /
  # `-strong` contrast work against regressions. Runs in parallel with `verify`
  # and per framework, so it never slows the main gate.
  a11y-browser:
    name: Accessibility · browser-axe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: ['@bpdm/ui', '@bpdm/ng']
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium (Playwright)
        run: pnpm --filter ${{ matrix.package }} exec playwright install --with-deps chromium

      # Storybook builds from source and imports the workspace's built packages
      # (e.g. @bpdm/variants dist) — a fresh install doesn't build them, so do it
      # here before the Storybook build inside the sweep.
      - name: Build workspace dependencies
        run: pnpm exec turbo run build --filter=${{ matrix.package }}^...

      - name: Contrast sweep (all themes × dir)
        run: pnpm --filter ${{ matrix.package }} test:a11y:browser
